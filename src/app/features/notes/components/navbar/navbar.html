<header class="navbar">

  <!-- LEFT SECTION -->

  <div class="navbar-left">

    <button
      type="button"
      class="icon-button menu-button"
      aria-label="Menu"
    >
      <img
        src="assets/icons/menu.png"
        alt="Menu"
      >
    </button>


    <div class="brand">

      <img
        src="assets/icons/keep-logo.png"
        alt="Keep"
        class="keep-logo"
      >

      <span class="brand-name">
        Keep
      </span>

    </div>

  </div>


  <!-- SEARCH -->

  <div class="search-container">

    <img
      src="assets/icons/search.png"
      alt="Search"
      class="search-icon"
    >

    <input
  type="text"
  placeholder="Search"
  [value]="searchText"
  (input)="searchText = $any($event.target).value; onSearchInput()"
  (keyup.enter)="onSearch()"
>

  </div>


  <!-- RIGHT SECTION -->

  <div class="navbar-right">

    <button
      type="button"
      class="icon-button"
      aria-label="Refresh"
      (click)="refresh()"
    >

      <img
        src="assets/icons/refresh.png"
        alt="Refresh"
      >

    </button>


    <button
      type="button"
      class="icon-button"
      aria-label="Change view"
      (click)="changeView()"
    >

      <img
        src="assets/icons/view-toggle.png"
        alt="Change view"
      >

    </button>


    <button
      type="button"
      class="icon-button"
      aria-label="Settings"
      (click)="openSettings()"
    >

      <img
        src="assets/icons/settings.png"
        alt="Settings"
      >

    </button>


    <button
      type="button"
      class="icon-button"
      aria-label="Google Apps"
      (click)="openGoogleApps()"
    >

      <img
        src="assets/icons/google-apps.png"
        alt="Google Apps"
      >

    </button>


    <!-- PROFILE -->

    <button
      type="button"
      class="profile-button"
      aria-label="Account"
    >
      C
    </button>

  </div>

</header>
